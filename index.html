function kpi(label,value,overall,note){const d=value-overall;return '<div class="kpi"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="sub '+deltaClass(d)+'">'+note+'</div></div>'}
function renderKpis(){const a=occ(state.a),k=a.kpis,o=DATA.overallKpis;const items=[['严格Cooler类',fmtPct(k.strictCooler),k.strictCooler,o.strictCooler],['午餐保温包/饭盒',fmtPct(k.lunchBag),k.lunchBag,o.lunchBag],['电制冷设备',fmtPct(k.electricCooling),k.electricCooling,o.electricCooling],['食品放在车内',fmtPct(k.vehicleStore),k.vehicleStore,o.vehicleStore],['不使用温控工具',fmtPct(k.noTool),k.noTool,o.noTool],['满意度',fmtNum(k.satisfaction)+' / 5',k.satisfaction,o.satisfaction]];$('kpis').innerHTML=items.map(x=>kpi(x[0],x[1],x[3],deltaText(x[2]-x[3]))).join('')}
function renderWarning(){const a=occ(state.a),b=state.compare?occ(state.b):null;const warnings=[];if(a.smallSample)warnings.push(a.name+'仅'+a.n+'人');if(b?.smallSample)warnings.push(b.name+'仅'+b.n+'人');$('warning').textContent=warnings.length?'谨慎解读：'+warnings.join('；')+'。小样本百分比波动较大。':'';$('warning').classList.toggle('show',warnings.length>0)}
function renderInsights(){const a=occ(state.a),s=a.summary;const arr=[['首要储存方式',s.topStorage?s.topStorage.label+' '+fmtPct(s.topStorage.rate):'无数据',''],['首要实际痛点',s.topPain?s.topPain.label+' '+fmtPct(s.topPain.rate):'无数据','risk'],['首要希望点',s.topWant?s.topWant.label+' '+fmtPct(s.topWant.rate):'无数据','opportunity']];$('insights').innerHTML=arr.map(x=>'<div class="insight '+x[2]+'"><div class="tag">'+x[0]+'</div><strong>'+x[1]+'</strong></div>').join('')}
function summaryBox(o){const s=o.summary,box=document.createElement('article');box.className='summary-box';const h=document.createElement('h2');h.textContent=o.name+' · 综合总结';box.appendChild(h);for(const [key,text] of [['主要方式',s.usage],['场景原因',s.reason],['需求方向',s.need]]){const row=document.createElement('div');row.className='summary-row';const k=document.createElement('div');k.className='summary-key';k.textContent=key;const v=document.createElement('div');v.textContent=text;row.append(k,v);box.appendChild(row)}const note=document.createElement('div');note.className='summary-note';note.textContent=s.note;box.appendChild(note);return box}
function renderSummaries(){const a=occ(state.a),b=occ(state.b);$('professionSummaries').className='summary-grid'+(state.compare?' compare':'');$('professionSummaries').innerHTML='';$('professionSummaries').appendChild(summaryBox(a));if(state.compare)$('professionSummaries').appendChild(summaryBox(b))}
function rowsFor(o){const key=state.module==='vehicle'?state.vehicleMode:state.module;let rows=[...(o.modules[key]||[])];const q=state.search.trim().toLowerCase();if(q)rows=rows.filter(x=>x.label.toLowerCase().includes(q));rows.sort((a,b)=>state.sort==='delta'?((b.delta??-99)-(a.delta??-99)):state.sort==='count'?(b.count-a.count):(b.rate-a.rate)||b.count-a.count);return rows}
function addWordCloud(wrap,o){const section=document.createElement('section');section.className='word-cloud-wrap';const head=document.createElement('div');head.className='word-cloud-head';const h=document.createElement('h4');h.textContent='开放题：具体携带食品词云';const meta=document.createElement('span');meta.textContent='有效文本 n='+o.wordCloud.textN+' · 按提及人数';head.append(h,meta);section.appendChild(head);const cloud=document.createElement('div');cloud.className='word-cloud';const words=o.wordCloud.words;if(!words.length){const e=document.createElement('span');e.className='word-empty';e.textContent='该职业没有足够的开放题食品文本';cloud.appendChild(e)}else{const max=words[0].count,min=words[words.length-1].count;words.forEach(w=>{const span=document.createElement('span');span.className='word';const scale=max===min ? .55 : (w.count-min)/(max-min);span.style.fontSize=(14+scale*22)+'px';span.style.opacity=String(.72+scale*.28);span.textContent=w.text;span.title=w.count+'人提及，占有效文本'+fmtPct(w.share);cloud.appendChild(span)})}section.appendChild(cloud);wrap.appendChild(section)}
function renderPanel(o){const rows=rowsFor(o);const wrap=document.createElement('article');wrap.className='panel';const head=document.createElement('div');head.className='panel-head';const h=document.createElement('h3');h.textContent=o.name;const meta=document.createElement('span');meta.textContent=(o.type==='group'?'合并组样本':'职业样本')+' n='+o.n;head.append(h,meta);wrap.appendChild(head);if(!rows.length){const e=document.createElement('div');e.className='empty';e.textContent='没有匹配项目';wrap.appendChild(e);return wrap}const t=document.createElement('table');t.className='rank-table';t.innerHTML='<thead><tr><th class="rank">排名</th><th class="item">项目</th><th class="num">人数</th><th class="share">占比 / 与整体差值</th></tr></thead>';const body=document.createElement('tbody');rows.forEach((r,i)=>{const tr=document.createElement('tr');const classes=[];if(i<3)classes.push('top'+(i+1));if(r.delta!=null&&r.delta>=.15)classes.push('value-up');if(r.delta!=null&&r.delta<=-.15)classes.push('value-down');tr.className=classes.join(' ');const cells=[['td','rank',String(i+1)],['td','item',r.label],['td','num',r.count+' / '+r.denominator]];for(const [tag,cls,text] of cells){const el=document.createElement(tag);el.className=cls;el.textContent=text;tr.appendChild(el)}const share=document.createElement('td');share.className='share'+(r.rate>=.5?' value-high':'');const line=document.createElement('div');line.innerHTML='<strong class="'+(r.rate>=.5?'metric-strong':'')+'">'+fmtPct(r.rate)+'</strong> <span class="'+deltaClass(r.delta)+'">'+(r.delta==null?'':deltaText(r.delta))+'</span>';const track=document.createElement('div');track.className='bar-track';const bar=document.createElement('div');bar.className='bar';bar.style.width=Math.max(1,Math.min(100,r.rate*100))+'%';track.appendChild(bar);share.append(line,track);tr.appendChild(share);body.appendChild(tr)});t.appendChild(body);wrap.appendChild(t);if(state.module==='food')addWordCloud(wrap,o);return wrap}
function renderDiff(a,b){if(!state.compare){$('diffFocus').hidden=true;return}const ar=rowsFor(a),br=rowsFor(b),map=new Map([...ar,...br].map(x=>[x.label,0]));const diffs=[];for(const label of map.keys()){const av=ar.find(x=>x.label===label)?.rate||0,bv=br.find(x=>x.label===label)?.rate||0;diffs.push({label,av,bv,d:av-bv})}diffs.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));$('diffList').innerHTML=diffs.slice(0,3).map(x=>'<div class="diff-item"><strong>'+x.label+'</strong><br>'+a.name+' '+fmtPct(x.av)+' · '+b.name+' '+fmtPct(x.bv)+'<br><span class="'+deltaClass(x.d)+'">差 '+Math.abs(x.d*100).toFixed(1)+'个百分点</span></div>').join('');$('diffFocus').hidden=false}
function render(){renderTabs();renderWarning();renderKpis();renderInsights();renderSummaries();$('moduleTitle').textContent=MODULES[state.module].title;$('moduleDescription').textContent=MODULES[state.module].desc;$('vehicleSub').hidden=state.module!=='vehicle';const a=occ(state.a),b=occ(state.b);$('tables').className='tables'+(state.compare?' compare':'');$('tables').innerHTML='';$('tables').appendChild(renderPanel(a));if(state.compare)$('tables').appendChild(renderPanel(b));renderDiff(a,b)}
$('profileType').onchange=e=>{state.profileType=e.target.value;populateSelects();render()};$('occA').onchange=e=>{state.a=e.target.value;render()};$('occB').onchange=e=>{state.b=e.target.value;render()};$('compareToggle').onchange=e=>{state.compare=e.target.checked;$('occBControl').hidden=!state.compare;render()};$('smallToggle').onchange=e=>{state.showSmall=e.target.checked;populateSelects();render()};$('sortMode').onchange=e=>{state.sort=e.target.value;render()};$('search').oninput=e=>{state.search=e.target.value;render()};$('vehicleMode').onchange=e=>{state.vehicleMode=e.target.value;render()};
populateSelects();render();
</script>
</body></html>
